name: Dependency Cleanup

on:
  push:
    branches:
      - chore/ai-slop-flush-template-residue

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/ai-slop-flush-template-residue
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Remove unused dependencies
        run: pnpm remove react-dropzone react-syntax-highlighter @tanstack/react-table swr chance
      - name: Remove unused type packages
        run: pnpm remove -D @types/chance @types/react-syntax-highlighter
      - name: Commit dependency cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "chore: remove unused dependencies"
          git push origin chore/ai-slop-flush-template-residue
