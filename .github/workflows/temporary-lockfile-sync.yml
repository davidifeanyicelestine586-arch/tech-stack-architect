name: Temporary PR lockfile sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and write the lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile to PR branch when changed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            const path = 'pnpm-lock.yaml';
            const generated = fs.readFileSync(path, 'utf8');
            const { data: existing } = await github.rest.repos.getContent({
              owner, repo, path, ref: branch
            });
            const current = Buffer.from(existing.content, 'base64').toString('utf8');
            if (current === generated) {
              core.info('Lockfile is already synchronized.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'chore: synchronize pnpm lockfile with manifest',
              content: Buffer.from(generated, 'utf8').toString('base64'),
              sha: existing.sha,
              branch
            });
            core.info('Updated PR branch lockfile from the merged manifest.');
