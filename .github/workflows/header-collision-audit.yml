name: Header Responsive Collision Audit

on:
  push:
    branches:
      - fix/header-responsive-collision
  pull_request:
  workflow_dispatch:

jobs:
  header-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start Next.js
        run: pnpm start > /tmp/next.log 2>&1 &
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/next.log
          exit 1
      - name: Install Playwright test runner
        run: pnpm add --save-dev playwright@1.55.0
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run header collision audit
        run: pnpm exec playwright test --config=playwright.header.config.mjs
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-collision-report
          path: playwright-report/header-collision/
