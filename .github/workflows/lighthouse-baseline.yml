name: Lighthouse Performance Baseline

on:
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: audit-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start Next.js
        run: pnpm start > /tmp/next.log 2>&1 &
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/next.log
          exit 1
      - name: Run Lighthouse mobile audits
        run: |
          mkdir -p /tmp/lighthouse
          npx --yes lighthouse@latest http://127.0.0.1:3000/ --preset=mobile --only-categories=performance --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lighthouse/home.json
          npx --yes lighthouse@latest http://127.0.0.1:3000/technologies/nextjs --preset=mobile --only-categories=performance --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lighthouse/technology-nextjs.json
          npx --yes lighthouse@latest http://127.0.0.1:3000/app --preset=mobile --only-categories=performance --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/lighthouse/app.json
      - name: Print baseline metrics
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          for (const file of ["home.json", "technology-nextjs.json", "app.json"]) {
            const report = JSON.parse(fs.readFileSync("/tmp/lighthouse/" + file, "utf8"));
            const a = report.audits;
            const metric = (id) => a[id]?.numericValue ?? null;
            console.log(JSON.stringify({
              route: report.finalDisplayedUrl,
              performanceScore: report.categories.performance.score,
              lcpMs: metric("largest-contentful-paint"),
              tbtMs: metric("total-blocking-time"),
              cls: metric("cumulative-layout-shift"),
              inpMs: metric("interaction-to-next-paint"),
            }));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-baseline
          path: /tmp/lighthouse/
