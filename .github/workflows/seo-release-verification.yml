name: SEO Release Verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  seo-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: audit-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Start Next.js
        run: pnpm start > /tmp/next.log 2>&1 &
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/next.log
          exit 1
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run SEO and keyboard verification
        run: pnpm exec playwright test tests/seo-release.spec.mjs
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-release-verification
          path: playwright-report/
